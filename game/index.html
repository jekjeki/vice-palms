<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vice Palms — a neon-night open-world driving game. Original code, no external assets.">
<title>VICE PALMS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #04050c;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    line-height: 0;
  }
  canvas#game {
    display: block;
    width: 1280px;
    height: 720px;
    border-radius: 6px;
    box-shadow:
      0 0 90px rgba(255, 64, 168, 0.16),
      0 0 34px rgba(24, 220, 255, 0.10),
      0 0 18px rgba(0, 0, 0, 0.85);
    background: #04050c;
    cursor: crosshair;
  }
  #boot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #37e6ff;
    font: 700 18px/1.4 "Consolas", "Courier New", monospace;
    letter-spacing: 0.35em;
    text-shadow: 0 0 18px rgba(55, 230, 255, 0.8);
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #boot.gone { opacity: 0; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="boot">LOADING VICE PALMS&hellip;</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
