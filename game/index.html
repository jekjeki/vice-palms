<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Palms</title>
<meta name="description" content="Vice Palms — a neon-soaked open-world driving game. Run the city, jack cars, dodge the VCPD.">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #07080f;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: auto;
    cursor: crosshair;
  }
  #nose {
    position: fixed;
    left: 8px;
    bottom: 6px;
    color: rgba(255,255,255,0.25);
    font: 10px monospace;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="nose">VICE PALMS · no libs · no network · 100% local</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
