<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Palms — a night-drive fable</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05060f;
    height: 100%;
    overflow: hidden;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas#game {
    background: #05060f;
    image-rendering: auto;
    box-shadow: 0 0 80px rgba(255, 45, 120, 0.12), 0 0 160px rgba(0, 229, 255, 0.06);
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
