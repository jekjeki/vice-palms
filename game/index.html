<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Vice Palms</title>
<meta name="description" content="Vice Palms — a neon night-coast crime sandbox. Drive, drift, dodge the VCPD, run jobs for Rico.">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #06040f; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#game {
    background: #06040f;
    image-rendering: auto;
    cursor: crosshair;
    outline: none;
    max-width: 100vw; max-height: 100vh;
    aspect-ratio: 16 / 9;
  }
  #nolibs { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" tabindex="0"></canvas>
</div>
<noscript>
  <p style="color:#ffd9f2;text-align:center">Vice Palms needs JavaScript — it is a whole game in a canvas.</p>
</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
